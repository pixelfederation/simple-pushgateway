{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: {{ include "simple-pushgateway.pdb.apiVersion" . }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "simple-pushgateway.fullname" . }}
  labels:
    {{- include "simple-pushgateway.labels" . | nindent 4 }}
{{- with .Values.podDisruptionBudget.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
{{- if and .Values.podDisruptionBudget.minAvailable .Values.podDisruptionBudget.maxUnavailable }}
{{- fail "podDisruptionBudget: set only one of minAvailable and maxUnavailable" }}
{{- end }}
{{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
{{- end }}
{{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
{{- end }}
  selector:
    matchLabels:
      {{- include "simple-pushgateway.selectorLabels" . | nindent 6 }}
      {{- with .Values.labels }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
